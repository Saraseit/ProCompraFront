<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ProCompra</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo claro -> oscuro.
      (function () {
        var tema = null
        try { tema = localStorage.getItem('procompra-tema') } catch (e) {}
        if (tema !== 'dark') tema = 'light'
        document.documentElement.setAttribute('data-theme', tema)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
